# Shared gitleaks config for Madwr1d repos. Copy to the repo root next to .githooks/.
# Extends the built-in ruleset; only allowlists OBVIOUS placeholders.
# Never allowlist a real key. To silence one specific line, append  gitleaks:allow  to it.
title = "madwr1d shared gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "placeholders, examples, lockfiles, test fixtures"
paths = [
  '''(^|/)\.env\.(example|sample|template|dist)$''',
  '''(^|/)[^/]*\.example(\.[a-z0-9]+)?$''',
  '''(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb)$''',
  '''(^|/)\.gitleaks\.toml$''',
]
regexes = [
  '''(?i)(your|my|example|sample|dummy|fake|test|placeholder)[_-]?(api[_-]?)?(key|token|secret|password)''',
  '''(?i)<(your[_ -]?)?[a-z_ -]*(key|token|secret|password)>''',
  '''(?i)\b(x{8,}|changeme|replace[_-]?me|todo[_-]?set[_-]?me)\b''',
  '''sk-(test|example|placeholder)[-_a-zA-Z0-9]*''',
  '''0x0{40,64}\b''',
]
stopwords = ["placeholder", "example", "changeme", "dummy", "xxxxxxxx"]
